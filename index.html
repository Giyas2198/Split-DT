<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Splitter & Auto-Rename (Jotun OCR Final Fix)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf-lib untuk memproses pemecahan file PDF -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <!-- pdf.js untuk rendering halaman PDF ke canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <!-- Tesseract.js untuk OCR -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">

    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6 md:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">📄 PDF Splitter & Auto-Rename (Jotun OCR Final Fix)</h1>
        <p class="text-sm text-slate-500 mb-6">Upload file PDF Scan Delivery Ticket. Membaca DT NO, Customer (DELIVER TO), dan Order No secara akurat.</p>

        <!-- 1. Form Upload -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">Upload File Scan (PDF):</label>
            <input type="file" id="pdfFile" accept="application/pdf" 
                class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl p-2">
            <p id="fileInfo" class="text-xs text-slate-400 mt-2 hidden">Total Halaman: <span id="totalPages" class="font-bold text-slate-600">0</span> <span id="statusOcr" class="text-blue-600 font-semibold ml-2"></span></p>
        </div>

        <!-- 2. Bagian Aturan Split & Rename -->
        <div id="splitSection" class="mb-6 hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-semibold text-slate-700">Atur Split & Nama Baru (Auto-Detected):</h2>
                <button onclick="addRow()" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-medium text-xs px-3 py-1.5 rounded-lg transition">+ Tambah Bagian</button>
            </div>

            <div id="splitRowsContainer" class="space-y-3"></div>
        </div>

        <!-- 3. Tombol Save -->
        <button id="saveBtn" onclick="processAndSave()" disabled 
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm cursor-pointer disabled:cursor-not-allowed">
            Proses & Download File
        </button>
    </div>

    <script>
        let loadedPdfBytes = null;
        let pdfDoc = null;
        let pdfJsDoc = null;
        let totalPagesCount = 0;

        const fileInput = document.getElementById('pdfFile');
        const fileInfo = document.getElementById('fileInfo');
        const totalPagesSpan = document.getElementById('totalPages');
        const statusOcr = document.getElementById('statusOcr');
        const splitSection = document.getElementById('splitSection');
        const splitRowsContainer = document.getElementById('splitRowsContainer');
        const saveBtn = document.getElementById('saveBtn');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function() {
                loadedPdfBytes = new Uint8Array(reader.result);
                try {
                    pdfDoc = await PDFLib.PDFDocument.load(loadedPdfBytes);
                    totalPagesCount = pdfDoc.getPageCount();

                    const loadingTask = pdfjsLib.getDocument({ data: loadedPdfBytes });
                    pdfJsDoc = await loadingTask.promise;

                    totalPagesSpan.innerText = totalPagesCount;
                    fileInfo.classList.remove('hidden');
                    splitSection.classList.remove('hidden');
                    splitRowsContainer.innerHTML = '';

                    for (let i = 1; i <= totalPagesCount; i++) {
                        statusOcr.innerText = `(Membaca OCR Halaman ${i}/${totalPagesCount}... Mohon Tunggu)`;
                        let detectedData = await extractJotunMetadataOCR(i);
                        let formattedName = `${detectedData.dtNo} - ${detectedData.deliverTo} - ${detectedData.orderNo}`;
                        addRow(formattedName, i, i);
                    }

                    statusOcr.innerText = '(Selesai Dibaca)';
                    saveBtn.disabled = false;

                } catch (err) {
                    alert('Gagal membaca file PDF.');
                    console.error(err);
                    statusOcr.innerText = '(Gagal)';
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Ekstraksi Metadata Menggunakan OCR Tesseract
        async function extractJotunMetadataOCR(pageNum) {
            let result = {
                dtNo: 'DT_UNKNOWN',
                deliverTo: 'CUSTOMER_UNKNOWN',
                orderNo: 'ORDER_UNKNOWN'
            };

            try {
                const page = await pdfJsDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 3.0 }); 
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                // Penajaman Gambar (Binarization)
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    let avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
                    let threshold = avg < 180 ? 0 : 255;
                    d[i] = threshold;
                    d[i + 1] = threshold;
                    d[i + 2] = threshold;
                }
                ctx.putImageData(imgData, 0, 0);

                const imageUrl = canvas.toDataURL('image/png');

                const { data: { text } } = await Tesseract.recognize(imageUrl, 'eng', {
                    logger: m => {} 
                });

                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                const fullStr = lines.join(' ');

                // 1. ATURAN DT NO: Cari angka 8 digit di dekat kata DT NO
                let dtMatch = fullStr.match(/DT\s*NO[^\d]*(\d{8})/i) || 
                              fullStr.match(/\b(1[5-7]\d{6})\b/) ||
                              fullStr.match(/(\d{8})(?=\s*DATE)/i);
                if (dtMatch) {
                    result.dtNo = dtMatch[1];
                }

                // 2. ATURAN DELIVER TO: Cari baris yang mengandung teks "PT" tepat setelah label DELIVER TO
                let deliverFound = false;
                for (let idx = 0; idx < lines.length; idx++) {
                    if (/DELIVER\s*TO/i.test(lines[idx])) {
                        // Cek beberapa baris ke bawah dari posisi "DELIVER TO"
                        for (let k = idx + 1; k <= idx + 3 && k < lines.length; k++) {
                            let candidate = lines[k];
                            // Pastikan mengambil baris nama perusahaan (biasanya mengandung PT atau karakter panjang)
                            if (/PT[\.\s]/i.test(candidate) && !/JOTUN/i.test(candidate)) {
                                result.deliverTo = candidate;
                                deliverFound = true;
                                break;
                            }
                        }
                        if (deliverFound) break;
                    }
                }

                // Fallback pencarian global jika baris terlewat
                if (result.deliverTo === 'CUSTOMER_UNKNOWN') {
                    let matchPt = fullStr.match(/(PT[\.\s][A-Z\s\.]+?)(?=\s+DEPO|\s+TANJUNG|\s+INVOICE)/i);
                    if (matchPt) {
                        result.deliverTo = matchPt[1].trim();
                    }
                }

                // 3. ATURAN ORDER NO
                let orderMatch = fullStr.match(/\b(W\d{8})\b/i);
                if (orderMatch) {
                    result.orderNo = orderMatch[1].toUpperCase();
                }

            } catch (err) {
                console.error(`Gagal OCR halaman ${pageNum}:`, err);
            }

            return result;
        }

        function addRow(defaultName = '', defaultStart = 1, defaultEnd = 1) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'flex flex-col sm:flex-row gap-2 items-center bg-slate-50 border border-slate-200 p-3 rounded-xl';
            
            rowDiv.innerHTML = `
                <div class="flex-1 w-full">
                    <label class="text-xs text-slate-500 mb-1 block">Format Nama File (DT - Toko - Order):</label>
                    <input type="text" value="${defaultName}" class="rename-input w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div class="w-full sm:w-20">
                    <label class="text-xs text-slate-500 mb-1 block">Dari Hal:</label>
                    <input type="number" min="1" max="${totalPagesCount}" value="${defaultStart}" class="start-page w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div class="w-full sm:w-20">
                    <label class="text-xs text-slate-500 mb-1 block">Sampai Hal:</label>
                    <input type="number" min="1" max="${totalPagesCount}" value="${defaultEnd}" class="end-page w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex items-end h-full pt-5">
                    <button onclick="this.parentElement.parentElement.remove()" class="text-rose-500 hover:text-rose-700 p-2 rounded-lg text-sm font-bold" title="Hapus baris">✕</button>
                </div>
            `;
            splitRowsContainer.appendChild(rowDiv);
        }

        async function processAndSave() {
            if (!pdfDoc) return;

            const rows = splitRowsContainer.querySelectorAll('div.flex-col');
            if (rows.length === 0) {
                alert('Minimal tentukan satu aturan split!');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerText = 'Memproses...';

            try {
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    let customName = row.querySelector('.rename-input').value.trim() || `dokumen_${i+1}`;
                    let startPage = parseInt(row.querySelector('.start-page').value);
                    let endPage = parseInt(row.querySelector('.end-page').value);

                    const newPdf = await PDFLib.PDFDocument.create();
                    const rangeIndexes = [];
                    for (let p = startPage - 1; p <= endPage - 1; p++) {
                        rangeIndexes.push(p);
                    }

                    const copiedPages = await newPdf.copyPages(pdfDoc, rangeIndexes);
                    copiedPages.forEach((page) => newPdf.addPage(page));

                    const pdfBytes = await newPdf.save();
                    let safeFileName = customName.replace(/[<>:"/\\|?*]/g, '');

                    downloadBlob(pdfBytes, `${safeFileName}.pdf`, 'application/pdf');
                }
                
                alert('Berhasil! File PDF telah di-split dan di-rename otomatis.');
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat memproses PDF.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Proses & Download File';
            }
        }

        function downloadBlob(data, filename, mimeType) {
            const blob = new Blob([data], { type: mimeType });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
